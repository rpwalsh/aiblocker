<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SlopBlocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <h1>SlopBlocker</h1>
      <span class="tagline">signals, not verdicts</span>
    </div>
    <label class="switch" title="Enable detection">
      <input type="checkbox" id="enabled">
      <span class="track"></span>
    </label>
  </header>

  <section class="hero">
    <div class="count" id="statsDetected">0</div>
    <div class="count-label">flagged on this page</div>
    <button id="rescan" class="ghost">Rescan</button>
  </section>

  <section class="card">
    <div class="card-title">Scan</div>
    <div class="chips">
      <label class="chip"><input type="checkbox" id="blockText"><span>Text</span></label>
      <label class="chip"><input type="checkbox" id="blockImages"><span>Images</span></label>
      <label class="chip"><input type="checkbox" id="blockVideo"><span>Video</span></label>
    </div>
    <div class="row">
      <label for="confidence">Sensitivity</label>
      <input type="range" id="confidence" min="0.3" max="0.9" step="0.1" value="0.5">
      <span id="confidenceValue" class="mono">50%</span>
    </div>
    <div class="row">
      <label for="blockingMode">On match</label>
      <select id="blockingMode">
        <option value="none">Badge only</option>
        <option value="blur">Blur</option>
        <option value="watermark">Watermark</option>
        <option value="hide">Hide</option>
      </select>
    </div>
  </section>

  <section class="card">
    <div class="card-title-row">
      <div class="card-title">Why flagged</div>
      <button id="refreshDetails" class="link">refresh</button>
    </div>
    <div id="detailsBody" class="details">
      <div class="empty">Click an outlined item on the page, or select text and right-click → Inspect with SlopBlocker.</div>
    </div>
  </section>

  <footer>
    <button id="openChecker" class="primary">Open Paste Checker</button>
    <button id="openOptions" class="ghost">Settings</button>
  </footer>
  <div class="legal">A lead to inspect, not a verdict — see DISCLAIMER in the repository.</div>

  <script src="popup.js"></script>
</body>
</html>
